# @ohos/dsh-bundle-ohos — HarmonyOS platform adapter rows.
#
# Applied after dsh-base + dsh-acp-app in the `ohos` profile:
#   1. one top-level insert adding the pure-JS search suite (the stock
#      tool-fs-search spawns @vscode/ripgrep through the subprocess seam, which
#      can never run on HarmonyOS — fork/exec is forbidden);
#   2. one id-targeted disable switching the stock row off, so `glob`/`grep`
#      resolve to the pure-JS implementation instead;
#   3. the same treatment for PTC: the stock ptc-runtime row loads
#      @deepseek-ai/dsh-ptc-runtime-node, whose child-process substrate can
#      never run here, so it is disabled and replaced by the in-process
#      worker+vm runtime; the tools row stays `mode: native` — every tool
#      (web_search, read/write, the pure-JS search suite, …) stays directly
#      callable exactly like the reference agents, and `run_code` remains a
#      direct tool alongside them, backed by the worker+vm runtime. (An earlier
#      revision forced `mode: ptc` here; that collapsed every tool behind
#      run_code, so the model saw no web/fs tools to call and answered "I
#      cannot search the web" — see docs/GAP-ANALYSIS.md §L2.)
#   4. the credentials-live plugin: dsh freezes the launch environment at
#      boot, so a key saved in Settings mid-session can never reach the
#      running runtime through env. The plugin polls the staged
#      `<dsh-home>/.api-key` file and pushes changes through the credentials
#      service's live set()/unset(), making saved keys effective without a
#      restart.
#
# Each plugin package must ALSO be declared in this bundle's `dependencies`:
# the profile-scope route table is built from the bundle dependency closure,
# so an undeclared package never mounts (verified — see docs/GAP-ANALYSIS.md §7).
- insert:
    - id: tool-fs-search-ohos
      name: "@ohos/dsh-tool-fs-search-js"
    - id: ptc-runtime-vm
      name: "@ohos/dsh-ptc-runtime-vm"
    - id: credentials-live-ohos
      name: "@ohos/dsh-credentials-live"
    # The ACP application bundle carries no clock context, so the model cannot
    # tell what "today" is: every relative date it reasons about (file
    # timestamps, "this week", scheduling) is a guess. dsh-sdk-app mounts this
    # row; the ohos profile has to state it itself. It injects a durable time
    # reading into request history (default: at most once per 10 minutes).
    - id: time-context
      name: "@deepseek-ai/dsh-time-context"
    # Writes the registered tool list and web readiness into bridge.log after
    # boot — the only way to answer "why can't it search the web" on a phone.
    - id: boot-report-ohos
      name: "@ohos/dsh-boot-report"
- id: tool-fs-search
  disabled: true
- id: ptc-runtime
  disabled: true
- id: tools
  config:
    mode: native


<svg width="512" height="512" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- far：大范围柔化，决定影子形体与纵深 -->
    <filter id="far" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.7"/>
    </filter>
    <!-- near：贴合边缘，撑住接触面 -->
    <filter id="near" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation=".5"/>
    </filter>
  </defs>

  <!-- 阴影不依赖 linearGradient。
       ArkUI 只保证 fill / fill-opacity / filter / transform(平移)，
       渐变一旦从 userSpaceOnUse 退回 objectBoundingBox，就按"每个元素自己的
       包围盒"计算：横杠只有 2.6 单位高，渐变在那点高度内已经淡到 0，阴影随之消失。
       改用两层固定不透明度的模糊，绕开渐变解析差异，同时保留远近两层叠出的纵深。

       横杠用 fill 的圆角矩形而非 stroke：stroke + 渐变会把一根杠画成两条边线。
       x=3.2 y=3.2 w=17.6 h=2.6 rx=1.3 等价于
       path "M4.5 4.5h15" + stroke-width 2.6 + linecap round。 -->

  <g filter="url(#far)" transform="translate(0.5 1.8)">
    <rect x="3.2" y="3.2" width="17.6" height="2.6" rx="1.3" fill="#000" fill-opacity="0.20"/>
    <path d="M12.5 5.5 L9.2 13.2 L12 13.2 L9.8 20.5 L15.8 11.8 L12.6 11.8 L14.2 5.5 Z" fill="#000" fill-opacity="0.20"/>
  </g>
  <g filter="url(#near)" transform="translate(0.4 0.9)">
    <rect x="3.2" y="3.2" width="17.6" height="2.6" rx="1.3" fill="#000" fill-opacity="0.34"/>
    <path d="M12.5 5.5 L9.2 13.2 L12 13.2 L9.8 20.5 L15.8 11.8 L12.6 11.8 L14.2 5.5 Z" fill="#000" fill-opacity="0.34"/>
  </g>

  <rect x="3.2" y="3.2" width="17.6" height="2.6" rx="1.3" fill="#1a1a1a"/>
  <path d="M12.5 5.5 L9.2 13.2 L12 13.2 L9.8 20.5 L15.8 11.8 L12.6 11.8 L14.2 5.5 Z" fill="#1a1a1a"/>
</svg>
